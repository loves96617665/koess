name = "video-generator-site"
compatibility_date = "2024-01-01"

# 站點設定
[site]
bucket = "./public"
entry-point = "workers-site"

# 環境變數 (部署時設定)
[vars]
# CUSTOM_API_URL = "https://your-api-endpoint.com"
